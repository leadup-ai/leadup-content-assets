name: materialize-image

# Decodes assets/b64/*.b64 (concatenated in filename order) into a real binary
# PNG at assets/images/<name>.png, then commits it. GitHub's MCP "create file"
# API base64-encodes every payload, so binary assets have to be shipped as
# base64 text chunks and re-assembled here.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Output file name (without .png)"
        required: false
        default: "card"
  push:
    paths:
      - "assets/b64/**"
      - ".github/workflows/materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode chunks
        run: |
          set -euo pipefail
          NAME="${{ github.event.inputs.name || 'card' }}"
          mkdir -p assets/images
          ls -l assets/b64/
          cat assets/b64/*.b64 > /tmp/payload.b64
          echo "chunks-chars: $(wc -c < /tmp/payload.b64)"
          base64 -d /tmp/payload.b64 > "assets/images/${NAME}.png"
          echo "bytes: $(wc -c < assets/images/${NAME}.png)"
          echo "sha256: $(sha256sum assets/images/${NAME}.png | cut -d' ' -f1)"
          echo "md5: $(md5sum assets/images/${NAME}.png | cut -d' ' -f1)"
          file "assets/images/${NAME}.png"
          python3 - <<'PY'
          import json, hashlib, os, glob
          out = {}
          for p in sorted(glob.glob("assets/images/*.png")):
              b = open(p, "rb").read()
              out[os.path.basename(p)] = {
                  "bytes": len(b),
                  "md5": hashlib.md5(b).hexdigest(),
                  "sha256": hashlib.sha256(b).hexdigest(),
              }
          json.dump(out, open("assets/images/index.json", "w"), indent=2, sort_keys=True)
          print(json.dumps(out, indent=2))
          PY

      - name: Commit result
        run: |
          set -euo pipefail
          git config user.name "leadup-bot"
          git config user.email "bot@leadup.ai"
          git add assets/images
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: materialize image from base64 chunks"
            git push
          fi
